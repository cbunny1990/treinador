name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:mcp-contract-http
      - run: npm run test:e2e
      - run: npm run test:e2e:subpath
      - run: node ./node_modules/@playwright/test/cli.js install --with-deps webkit
      - run: npm run test:e2e:webkit-photo
      - run: npm run test:e2e:webkit-scroll
