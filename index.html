<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Workspace partilhado entre treinador e agente para gerir uma equipa de futebol.">
  <title>Vision Coach · Workspace</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegação principal">
      <a class="brand" href="#/">
        <span class="brand-mark">TP</span>
        <span><strong>Vision Coach</strong><small>Human–AI Workspace</small></span>
      </a>
      <nav class="side-nav">
        <a href="#/" data-tab="workspace"><span class="nav-dot"></span>Workspace</a>
        <a href="#/equipa" data-tab="equipa"><span class="nav-dot"></span>Equipa</a>
        <a href="#/planos" data-tab="planos"><span class="nav-dot"></span>Planos</a>
        <a href="#/media" data-tab="media"><span class="nav-dot"></span>Media</a>
        <a href="#/timeline" data-tab="timeline"><span class="nav-dot"></span>Timeline</a>
      </nav>
      <div class="sidebar-foot">
        <div class="agent-state" id="remote-state">
          <span class="status-dot" id="remote-dot"></span>
          <div><strong id="remote-title">Workspace local</strong><small id="remote-detail">Ligação remota por configurar</small></div>
        </div>
        <a class="settings-link" href="#/definicoes">Definições e backup</a>
      </div>
    </aside>

    <section class="content-shell">
      <header class="topbar">
        <div>
          <p id="eyebrow" class="eyebrow">Workspace</p>
          <h1 id="titulo">Vision Coach</h1>
        </div>
        <div class="topbar-actions">
          <span id="badge-off" class="offline-badge" hidden>Offline</span>
          <button class="icon-button" id="quick-capture" type="button" aria-label="Registar observação">+</button>
        </div>
      </header>
      <main id="app" class="page"></main>
    </section>
  </div>

  <nav class="bottom-nav" aria-label="Navegação móvel">
    <a href="#/" data-tab="workspace"><span>W</span>Workspace</a>
    <a href="#/equipa" data-tab="equipa"><span>E</span>Equipa</a>
    <a href="#/planos" data-tab="planos"><span>P</span>Planos</a>
    <a href="#/media" data-tab="media"><span>M</span>Media</a>
    <a href="#/timeline" data-tab="timeline"><span>T</span>Timeline</a>
  </nav>
  <script src="vendor/supabase.min.js"></script>
  <script src="vendor/tus.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/head_coach_memory.js"></script>
  <script src="js/head_coach_media.js"></script>
  <script src="js/workspace.js"></script>
  <script src="js/remote_workspace.js"></script>
  <script src="js/agent_contract.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
    }
    const badge = document.getElementById("badge-off");
    const syncNetworkBadge = () => { badge.hidden = navigator.onLine; };
    window.addEventListener("online", syncNetworkBadge);
    window.addEventListener("offline", syncNetworkBadge);
    syncNetworkBadge();
  </script>
</body>
</html>
